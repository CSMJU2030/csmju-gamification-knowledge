# manifest ของระบบย่อย — CI และ conformance อ่านไฟล์นี้ไฟล์เดียว
# schema: standards/schemas/subsystem.schema.json

name: csmju-gamification-knowledge          # ต้องตรงกับทะเบียนใน Core Hub และกับ data.service ของ /api/health
standards_version: "1.0.0"
conformance_level: L3                 # L1 · L2 · L3 (ระบบที่มี UI ต้องถึง L3)

base_url: http://localhost:3002       # URL ของระบบย่อยตอนรันเพื่อทดสอบ
core_hub_url: http://localhost:3000
callback_path: /auth/callback         # ต้องตรงกับ callback_url ที่ลงทะเบียนไว้

public_endpoints:
  - GET /api/health
  - GET /auth/callback

# conformance ใช้ probes ตรวจสัญญา API — ประกาศไม่ครบ = ขึ้น SKIP = ยังไม่ผ่าน
probes:
  # โจทย์ BloxCode (D4) — คอลเลกชันเดียวที่ staff อ่าน/สร้างได้และ student สร้างไม่ได้
  collection: /api/v1/challenges
  not_found: /api/v1/challenges/99999999-9999-4999-8999-999999999999
  invalid_id: /api/v1/challenges/not-a-uuid
  create:
    path: /api/v1/challenges
    allowed_role: staff
    denied_role: student
    invalid_body:
      title: ""
    valid_body:
      title: "โจทย์ทดสอบจาก conformance"

owners:
  pl: "@csmju2030/pl-gamification-knowledge"
  aie: "@csmju2030/aie-gamification-knowledge"

display_name: "Gamification Knowledge"
repo: github.com/CSMJU2030/csmju-gamification-knowledge
status: proposed
